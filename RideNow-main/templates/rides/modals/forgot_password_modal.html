<!-- Forgot Password Modal -->
<div id="forgotPasswordModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 transform transition-all">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Reset Password</h2>
                <button id="closeForgotPasswordModal" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Step 1: Enter Phone Number -->
            <div id="forgotPasswordStep1">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-key text-3xl text-primary-500"></i>
                    </div>
                    <p class="text-gray-600">
                        Enter your registered phone number to receive a password reset code
                    </p>
                </div>
                
                <form id="forgotPasswordForm">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-phone mr-2 text-primary-500"></i>Phone Number
                        </label>
                        <div id="forgotPasswordPhoneSelector"></div>
                        <!-- <div class="mt-2 p-2 bg-gray-50 border border-gray-200 rounded-lg">
                            <div class="flex items-start">
                                <i class="fas fa-info-circle text-gray-500 mt-0.5 mr-2"></i>
                                <div class="text-xs text-gray-600">
                                    Enter your registered number <strong>without</strong> the leading 0 (e.g., 700123456)
                                </div>
                            </div>
                        </div> -->
                    </div>
                    
                    <div id="forgotPasswordError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="forgotPasswordErrorText"></span>
                    </div>
                    
                    <button 
                        type="submit" 
                        id="sendResetCodeBtn"
                        class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 px-6 rounded-lg font-semibold transition-colors">
                        <i class="fas fa-paper-plane mr-2"></i>Send Reset Code
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <button id="backToLoginFromForgot" class="text-primary-500 hover:text-primary-600 text-sm">
                        <i class="fas fa-arrow-left mr-1"></i>Back to Login
                    </button>
                </div>
            </div>
            
            <!-- Step 2: Enter OTP and New Password -->
            <div id="forgotPasswordStep2" class="hidden">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-lock-open text-3xl text-primary-500"></i>
                    </div>
                    <p class="text-gray-600">
                        Enter the code sent to<br>
                        <span id="resetPhoneDisplay" class="font-semibold text-gray-900"></span>
                    </p>
                </div>
                
                <form id="resetPasswordForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2 text-center">
                            Verification Code
                        </label>
                        <input 
                            type="text" 
                            id="resetOTPCode" 
                            class="w-full px-4 py-3 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 tracking-widest"
                            placeholder="000000"
                            maxlength="6"
                            pattern="[0-9]{6}"
                            required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2 text-primary-500"></i>New Password
                        </label>
                        <div class="relative">
                            <input 
                                type="password" 
                                id="resetNewPassword" 
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                                placeholder="Enter new password"
                                minlength="6"
                                required>
                            <button type="button" id="toggleResetPassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2 text-primary-500"></i>Confirm Password
                        </label>
                        <input 
                            type="password" 
                            id="resetConfirmPassword" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                            placeholder="Confirm new password"
                            minlength="6"
                            required>
                    </div>
                    
                    <div id="resetPasswordError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="resetPasswordErrorText"></span>
                    </div>
                    
                    <button 
                        type="submit" 
                        id="resetPasswordBtn"
                        class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 px-6 rounded-lg font-semibold transition-colors">
                        <i class="fas fa-check-circle mr-2"></i>Reset Password
                    </button>
                </form>
                
                <div class="mt-4 text-center">
                    <button id="resendResetOTP" class="text-primary-500 hover:text-primary-600 text-sm">
                        Resend Code
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let resetPhoneNumber = '';
    
    // Forgot Password Modal Controls
    let forgotPasswordPhoneSelector = null;
    
    function showForgotPasswordModal() {
        document.getElementById('forgotPasswordModal').classList.remove('hidden');
        document.getElementById('forgotPasswordStep1').classList.remove('hidden');
        document.getElementById('forgotPasswordStep2').classList.add('hidden');
        
        // Wait a bit for the modal to be visible before initializing
        setTimeout(() => {
            // Check if container exists
            const container = document.getElementById('forgotPasswordPhoneSelector');
            console.log('Forgot password container found:', container); // Debug log
            
            // Initialize country code selector using manager
            if (window.countryCodeManager) {
                try {
                    forgotPasswordPhoneSelector = countryCodeManager.create('forgotPasswordPhoneSelector', {
                        defaultCountry: 'UG',
                        searchEnabled: true
                    });
                    console.log('Forgot password phone selector initialized:', forgotPasswordPhoneSelector); // Debug log
                    
                    // Test the selector immediately
                    if (forgotPasswordPhoneSelector) {
                        console.log('Selector getValue test:', forgotPasswordPhoneSelector.getValue());
                        console.log('Selector validate test:', forgotPasswordPhoneSelector.validate());
                    }
                } catch (error) {
                    console.error('Error initializing forgot password selector:', error);
                }
            } else {
                console.error('Country code manager not available'); // Debug log
            }
        }, 100);
    }
    
    function hideForgotPasswordModal() {
        document.getElementById('forgotPasswordModal').classList.add('hidden');
        document.getElementById('forgotPasswordForm').reset();
        document.getElementById('resetPasswordForm').reset();
        document.getElementById('forgotPasswordError').classList.add('hidden');
        document.getElementById('resetPasswordError').classList.add('hidden');
        
        // Reset phone selector if it exists
        if (forgotPasswordPhoneSelector) {
            forgotPasswordPhoneSelector.setValue('');
        }
        
        // Don't destroy the selector, just reset it
        // This allows for faster re-opening
    }
    
    document.getElementById('closeForgotPasswordModal').addEventListener('click', hideForgotPasswordModal);
    
    // Back to login
    document.getElementById('backToLoginFromForgot').addEventListener('click', () => {
        hideForgotPasswordModal();
        showLoginModal();
    });
    
    // Toggle password visibility
    document.getElementById('toggleResetPassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('resetNewPassword');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
    
    // Step 1: Send reset code
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('sendResetCodeBtn');
        const errorDiv = document.getElementById('forgotPasswordError');
        const errorText = document.getElementById('forgotPasswordErrorText');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Sending code...';
        errorDiv.classList.add('hidden');
        
        try {
            const csrftoken = getCookie('csrftoken');
            
            // Get phone number from selector
            let phone = '';
            if (forgotPasswordPhoneSelector) {
                phone = forgotPasswordPhoneSelector.getValue();
                console.log('Forgot password phone from selector:', phone); // Debug log
            } else {
                console.error('Forgot password phone selector not initialized'); // Debug log
                errorText.textContent = 'Phone selector not initialized. Please refresh and try again.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate phone number
            if (!phone || phone.trim() === '') {
                errorText.textContent = 'Please enter a valid phone number';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate phone number format
            if (forgotPasswordPhoneSelector && !forgotPasswordPhoneSelector.validate()) {
                const validationMessage = forgotPasswordPhoneSelector.getValidationMessage();
                errorText.textContent = validationMessage;
                errorDiv.classList.remove('hidden');
                return;
            }
            
            const response = await fetch('/accounts/api/password-reset/request/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    phone_number: phone
                })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                resetPhoneNumber = phone;
                document.getElementById('resetPhoneDisplay').textContent = phone;
                
                // Show step 2
                document.getElementById('forgotPasswordStep1').classList.add('hidden');
                document.getElementById('forgotPasswordStep2').classList.remove('hidden');
                
                console.log('Moved to step 2, phone number stored:', resetPhoneNumber); // Debug log
                
                SweetAlert.success('Code Sent!', 'Check your phone for the reset code', {
                    timer: 2000,
                    showConfirmButton: false
                });
            } else {
                errorText.textContent = data.error || 'Failed to send reset code';
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Send reset code error:', error);
            errorText.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Send Reset Code';
        }
    });
    
    // Step 2: Reset password
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('resetPasswordBtn');
        const errorDiv = document.getElementById('resetPasswordError');
        const errorText = document.getElementById('resetPasswordErrorText');
        
        const otp = document.getElementById('resetOTPCode').value;
        const newPassword = document.getElementById('resetNewPassword').value;
        const confirmPassword = document.getElementById('resetConfirmPassword').value;
        
        // Validate passwords match
        if (newPassword !== confirmPassword) {
            errorText.textContent = 'Passwords do not match';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Resetting...';
        errorDiv.classList.add('hidden');
        
        try {
            const csrftoken = getCookie('csrftoken');
            
            const response = await fetch('/accounts/api/password-reset/confirm/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    phone_number: resetPhoneNumber,
                    otp: otp,
                    new_password: newPassword
                })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                hideForgotPasswordModal();
                
                SweetAlert.success('Password Reset!', 'Your password has been reset successfully. Please login.').then(() => {
                    showLoginModal();
                });
            } else {
                errorText.textContent = data.error || 'Password reset failed';
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Reset password error:', error);
            errorText.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Reset Password';
        }
    });
    
    // Resend reset OTP
    document.getElementById('resendResetOTP').addEventListener('click', async () => {
        try {
            const csrftoken = getCookie('csrftoken');
            
            const response = await fetch('/accounts/api/password-reset/request/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    phone_number: resetPhoneNumber
                })
            });
            
            if (response.ok) {
                SweetAlert.success('Code Sent!', 'A new reset code has been sent', {
                    timer: 2000,
                    showConfirmButton: false
                });
            }
        } catch (error) {
            console.error('Resend reset OTP error:', error);
        }
    });
</script>
