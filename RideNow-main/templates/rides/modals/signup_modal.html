<!-- Signup Modal -->
<div id="signupModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 transform transition-all max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Create Account</h2>
                <button id="closeSignupModal" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <p class="text-gray-600 mb-6">Quick signup to book your ride</p>
            
            <form id="signupForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-user mr-2 text-primary-500"></i>Full Name
                    </label>
                    <input 
                        type="text" 
                        id="signupName" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="John Doe"
                        required>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-2 text-primary-500"></i>Email (Optional)
                    </label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                        placeholder="john@example.com">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-phone mr-2 text-primary-500"></i>Phone Number
                    </label>
                    <div id="signupPhoneSelector"></div>
                    <p class="text-xs text-gray-500 mt-1">We'll send an OTP to verify your number</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-primary-500"></i>Password
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="signupPassword" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                            placeholder="Create a strong password"
                            required>
                        <button type="button" id="toggleSignupPassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <div class="flex items-center space-x-2 text-xs">
                            <span class="text-gray-500">Password strength:</span>
                            <div class="flex-1 bg-gray-200 rounded-full h-2">
                                <div id="signupPasswordStrength" class="h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                            <span id="signupPasswordStrengthText" class="text-gray-500">Weak</span>
                        </div>
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="flex items-start">
                        <input type="checkbox" id="agreeTerms" class="mt-1 mr-2" required>
                        <span class="text-sm text-gray-600">
                            I agree to the <a href="#" class="text-primary-500 hover:underline">Terms of Service</a> and 
                            <a href="#" class="text-primary-500 hover:underline">Privacy Policy</a>
                        </span>
                    </label>
                </div>
                
                <div id="signupError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="signupErrorText"></span>
                </div>
                
                <button 
                    type="submit" 
                    id="signupSubmitBtn"
                    class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 px-6 rounded-lg font-semibold text-lg transition-colors">
                    <i class="fas fa-user-plus mr-2"></i>Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Already have an account? 
                    <button id="showLoginFromSignup" class="text-primary-500 hover:text-primary-600 font-semibold">
                        Login
                    </button>
                </p>
            </div>

            <div class="flex items-center my-4">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="px-4 text-sm text-gray-500 font-medium">or</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>

            <!-- Social Login Options -->
            <div class="mb-6 space-y-3">
                <a href="/accounts/google/login/?next={{ request.path|urlencode }}" class="flex items-center justify-center w-full px-4 py-3 border-2 border-blue-500 text-blue-500 rounded-lg hover:bg-blue-500 hover:text-white transition-all duration-200 font-medium">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="text-sm">Sign up with Google</span>
                </a>
                
                <a href="/accounts/apple/login/?next={{ request.path|urlencode }}" class="flex items-center justify-center w-full px-4 py-3 border-2 border-black text-black rounded-lg hover:bg-black hover:text-white transition-all duration-200 font-medium">
                    <i class="fab fa-apple text-xl mr-2"></i>
                    <span class="text-sm">Sign up with Apple</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    // Signup Modal Controls
    let signupPhoneSelector = null;
    
    function showSignupModal() {
        document.getElementById('signupModal').classList.remove('hidden');
        
        // Wait a bit for the modal to be visible before initializing
        setTimeout(() => {
            // Initialize country code selector using manager
            if (window.countryCodeManager) {
                signupPhoneSelector = countryCodeManager.create('signupPhoneSelector', {
                    defaultCountry: 'UG',
                    searchEnabled: true
                });
                console.log('Signup phone selector initialized:', signupPhoneSelector); // Debug log
            } else {
                console.error('Country code manager not available'); // Debug log
            }
        }, 100);
    }
    
    function hideSignupModal() {
        document.getElementById('signupModal').classList.add('hidden');
        document.getElementById('signupForm').reset();
        document.getElementById('signupError').classList.add('hidden');
        
        // Reset phone selector if it exists
        if (signupPhoneSelector) {
            signupPhoneSelector.setValue('');
        }
        
        // Don't destroy the selector, just reset it
        // This allows for faster re-opening
    }
    
    document.getElementById('closeSignupModal').addEventListener('click', hideSignupModal);
    
    // Debug function - can be called from browser console
    window.debugSignupPhone = function() {
        console.log('=== Signup Phone Debug ===');
        console.log('Signup phone selector:', signupPhoneSelector);
        console.log('Country code manager:', window.countryCodeManager);
        if (signupPhoneSelector) {
            console.log('Phone value:', signupPhoneSelector.getValue());
            console.log('Phone validation:', signupPhoneSelector.validate());
            console.log('Validation message:', signupPhoneSelector.getValidationMessage());
        }
        return signupPhoneSelector;
    };
    
    // Toggle password visibility
    document.getElementById('toggleSignupPassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('signupPassword');
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });

    // Password strength indicator
    const signupPasswordStrength = document.getElementById('signupPasswordStrength');
    const signupPasswordStrengthText = document.getElementById('signupPasswordStrengthText');
    const signupPasswordField = document.getElementById('signupPassword');
    let isSignupPasswordStrong = false;

    function calculatePasswordStrength(password) {
        let score = 0;
        let feedback = [];

        if (password.length >= 8) score += 20;
        else feedback.push('at least 8 characters');

        if (/[a-z]/.test(password)) score += 20;
        else feedback.push('lowercase letters');

        if (/[A-Z]/.test(password)) score += 20;
        else feedback.push('uppercase letters');

        if (/[0-9]/.test(password)) score += 20;
        else feedback.push('numbers');

        if (/[^A-Za-z0-9]/.test(password)) score += 20;
        else feedback.push('special characters');

        let text = 'Weak';
        if (score >= 80) text = 'Strong';
        else if (score >= 60) text = 'Good';
        else if (score >= 40) text = 'Fair';

        return { percentage: score, text: text };
    }

    signupPasswordField.addEventListener('input', function() {
        const password = this.value;
        const strength = calculatePasswordStrength(password);
        
        signupPasswordStrength.style.width = strength.percentage + '%';
        signupPasswordStrengthText.textContent = strength.text;
        
        // Update colors and track if password is strong enough
        signupPasswordStrength.className = 'h-2 rounded-full transition-all duration-300';
        if (strength.percentage < 30) {
            signupPasswordStrength.classList.add('bg-red-500');
            isSignupPasswordStrong = false;
        } else if (strength.percentage < 70) {
            signupPasswordStrength.classList.add('bg-yellow-500');
            isSignupPasswordStrong = false;
        } else {
            signupPasswordStrength.classList.add('bg-green-500');
            isSignupPasswordStrong = true;
        }
    });
    
    // Signup form submission
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('signupSubmitBtn');
        const errorDiv = document.getElementById('signupError');
        const errorText = document.getElementById('signupErrorText');
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating account...';
        errorDiv.classList.add('hidden');
        
        try {
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const csrftoken = getCookie('csrftoken');
            
            // Get phone number from selector
            let phone = '';
            if (signupPhoneSelector) {
                phone = signupPhoneSelector.getValue();
                console.log('Phone from selector:', phone); // Debug log
            } else {
                console.error('Signup phone selector not initialized'); // Debug log
                errorText.textContent = 'Phone selector not initialized. Please refresh and try again.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate phone number
            if (!phone || phone.trim() === '') {
                errorText.textContent = 'Please enter a valid phone number';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate phone number format
            if (signupPhoneSelector && !signupPhoneSelector.validate()) {
                const validationMessage = signupPhoneSelector.getValidationMessage();
                errorText.textContent = validationMessage;
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Validate password strength
            if (!isSignupPasswordStrong) {
                errorText.textContent = 'Password must be strong (green indicator) to continue.';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            // Prepare request data
            const requestData = {
                full_name: name,
                phone_number: phone,
                password: password,
                user_type: 'client'
            };
            
            // Only include email if it's not empty
            if (email) {
                requestData.email = email;
            }
            
            console.log('Submitting signup with data:', requestData); // Debug log
            
            const response = await fetch('/accounts/api/signup/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify(requestData)
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                // Store phone for OTP verification
                sessionStorage.setItem('pendingVerificationPhone', phone);
                sessionStorage.setItem('pendingVerificationName', name);
                
                hideSignupModal();
                
                // Check if SMS was sent successfully
                if (data.sms_sent) {
                    showOTPModal(phone);
                } else {
                    // SMS failed, show OTP modal with special message
                    if (data.debug_otp) {
                        // Development mode - show OTP directly
                        SweetAlert.custom({
                            title: 'Account Created!',
                            html: `
                                <div style="text-align: left;">
                                    <p><strong>Account created successfully!</strong></p>
                                    <p>SMS could not be sent, but you can still verify your account.</p>
                                    <div style="background: #f0fdf4; padding: 10px; border-radius: 6px; margin: 10px 0;">
                                        <p><strong>Your verification code:</strong></p>
                                        <p style="font-size: 24px; font-weight: bold; color: #008080; text-align: center;">${data.debug_otp}</p>
                                    </div>
                                    <p style="font-size: 12px; color: #666;">Use this code to verify your account.</p>
                                </div>
                            `,
                            confirmButtonText: 'Continue to Verification',
                            showCancelButton: false
                        }).then(() => {
                            showOTPModal(phone);
                        });
                    } else {
                        // Production mode - show error message
                        SweetAlert.error('Account Created', 'Account created but SMS could not be sent. Please contact support for verification.');
                    }
                }
            } else {
                errorText.textContent = data.error || 'Signup failed. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Signup error:', error);
            errorText.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus mr-2"></i>Create Account';
        }
    });
    
    // Show login modal from signup
    document.getElementById('showLoginFromSignup').addEventListener('click', () => {
        hideSignupModal();
        showLoginModal();
    });
</script>
