<!-- OTP Verification Modal -->
<div id="otpModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 transform transition-all">
        <div class="p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Verify Phone</h2>
                <button id="closeOTPModal" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-primary-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-mobile-alt text-3xl text-primary-500"></i>
                </div>
                <p class="text-gray-600">
                    We've sent a verification code to<br>
                    <span id="otpPhoneDisplay" class="font-semibold text-gray-900"></span>
                </p>
            </div>
            
            <form id="otpForm">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-3 text-center">
                        Enter 6-digit code
                    </label>
                    <div class="flex justify-center gap-2">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="0">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="1">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="2">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="3">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="4">
                        <input type="text" maxlength="1" class="otp-input w-12 h-12 text-center text-2xl font-bold border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500" data-index="5">
                    </div>
                </div>
                
                <div id="otpError" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="otpErrorText"></span>
                </div>
                
                <button 
                    type="submit" 
                    id="otpSubmitBtn"
                    class="w-full bg-primary-500 hover:bg-primary-600 text-white py-3 px-6 rounded-lg font-semibold text-lg transition-colors">
                    <i class="fas fa-check-circle mr-2"></i>Verify & Continue
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Didn't receive code? 
                    <button id="resendOTP" class="text-primary-500 hover:text-primary-600 font-semibold">
                        Resend OTP
                    </button>
                </p>
                <p id="otpTimer" class="text-xs text-gray-500 mt-2"></p>
            </div>
        </div>
    </div>
</div>

<script>
    let otpPhoneNumber = '';
    let resendTimer = null;
    
    // OTP Modal Controls
    function showOTPModal(phone) {
        otpPhoneNumber = phone;
        document.getElementById('otpPhoneDisplay').textContent = phone;
        document.getElementById('otpModal').classList.remove('hidden');
        
        // Focus first input
        document.querySelectorAll('.otp-input')[0].focus();
        
        // Start resend timer
        startResendTimer();
    }
    
    function hideOTPModal() {
        document.getElementById('otpModal').classList.add('hidden');
        document.getElementById('otpForm').reset();
        document.getElementById('otpError').classList.add('hidden');
        document.querySelectorAll('.otp-input').forEach(input => input.value = '');
        if (resendTimer) clearInterval(resendTimer);
    }
    
    document.getElementById('closeOTPModal').addEventListener('click', hideOTPModal);
    
    // OTP Input handling
    const otpInputs = document.querySelectorAll('.otp-input');
    
    otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const value = e.target.value;
            
            // Only allow numbers
            if (!/^\d*$/.test(value)) {
                e.target.value = '';
                return;
            }
            
            // Move to next input if value entered
            if (value && index < otpInputs.length - 1) {
                otpInputs[index + 1].focus();
            }
            
            // Auto-submit when all inputs filled
            const allFilled = Array.from(otpInputs).every(inp => inp.value);
            if (allFilled) {
                document.getElementById('otpForm').dispatchEvent(new Event('submit'));
            }
        });
        
        input.addEventListener('keydown', (e) => {
            // Move to previous input on backspace if empty
            if (e.key === 'Backspace' && !e.target.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });
        
        input.addEventListener('paste', (e) => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').slice(0, 6);
            
            if (/^\d+$/.test(pastedData)) {
                pastedData.split('').forEach((char, i) => {
                    if (otpInputs[i]) {
                        otpInputs[i].value = char;
                    }
                });
                
                // Auto-submit if 6 digits pasted
                if (pastedData.length === 6) {
                    document.getElementById('otpForm').dispatchEvent(new Event('submit'));
                }
            }
        });
    });
    
    // Resend timer
    function startResendTimer() {
        let seconds = 60;
        const timerEl = document.getElementById('otpTimer');
        const resendBtn = document.getElementById('resendOTP');
        
        resendBtn.disabled = true;
        resendBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        resendTimer = setInterval(() => {
            seconds--;
            timerEl.textContent = `Resend available in ${seconds}s`;
            
            if (seconds <= 0) {
                clearInterval(resendTimer);
                timerEl.textContent = '';
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }, 1000);
    }
    
    // Resend OTP
    document.getElementById('resendOTP').addEventListener('click', async () => {
        const btn = document.getElementById('resendOTP');
        btn.disabled = true;
        
        try {
            const csrftoken = getCookie('csrftoken');
            const response = await fetch('/accounts/api/resend-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    phone_number: otpPhoneNumber
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                SweetAlert.success('OTP Sent!', 'A new verification code has been sent', {
                    timer: 2000,
                    showConfirmButton: false
                });
                startResendTimer();
            }
        } catch (error) {
            console.error('Resend OTP error:', error);
        }
    });
    
    // OTP form submission
    document.getElementById('otpForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('otpSubmitBtn');
        const errorDiv = document.getElementById('otpError');
        const errorText = document.getElementById('otpErrorText');
        
        // Get OTP code
        const otp = Array.from(otpInputs).map(input => input.value).join('');
        
        if (otp.length !== 6) {
            errorText.textContent = 'Please enter all 6 digits';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Verifying...';
        errorDiv.classList.add('hidden');
        
        try {
            const csrftoken = getCookie('csrftoken');
            
            const response = await fetch('/accounts/api/verify-otp/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken
                },
                body: JSON.stringify({
                    phone_number: otpPhoneNumber,
                    otp: otp
                })
            });
            
            const data = await response.json();
            
            if (response.ok && data.success) {
                hideOTPModal();
                
                // Check if this is a new user who needs profile setup
                const isNewUser = sessionStorage.getItem('pendingVerificationName') !== null;
                
                if (isNewUser) {
                    SweetAlert.success('Verified!', 'Account verified. Let\'s complete your profile', {
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                    // Show profile setup modal
                    setTimeout(() => {
                        sessionStorage.removeItem('pendingVerificationPhone');
                        sessionStorage.removeItem('pendingVerificationName');
                        showProfileSetupModal();
                    }, 2000);
                } else {
                    SweetAlert.success('Verified!', 'Your account has been verified successfully', {
                        timer: 2000,
                        showConfirmButton: false
                    });
                    
                    // Reload page to get authenticated state
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                }
            } else {
                errorText.textContent = data.error || 'Invalid OTP. Please try again.';
                errorDiv.classList.remove('hidden');
                
                // Clear inputs
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            }
        } catch (error) {
            console.error('OTP verification error:', error);
            errorText.textContent = 'An error occurred. Please try again.';
            errorDiv.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Verify & Continue';
        }
    });
</script>
