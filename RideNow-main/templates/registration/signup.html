{% extends 'landing_page.html' %}

{% block title %}Driver Sign Up - RideNow{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Become a RideNow Driver/Rider</h1>
    <p class="text-muted text-center mb-4">Join our community and start earning by providing safe and reliable transportation services.</p>
    <form method="POST" class="shadow p-4 rounded" style="background-color: #f9f9f9;">
        {% csrf_token %}
        <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="Enter your full name" required>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter your phone number" required>
        </div>
        <div class="mb-3">
            <label for="license_number" class="form-label">Driver's License Number</label>
            <input type="text" class="form-control" id="license_number" name="license_number" placeholder="Enter your license number" required>
        </div>
        <div class="mb-3">
            <label for="vehicle_details" class="form-label">Vehicle Details</label>
            <textarea class="form-control" id="vehicle_details" name="vehicle_details" rows="3" placeholder="E.g., Toyota Corolla 2019, White, Registration ABC123" required></textarea>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
        </div>
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">
                I agree to the <a href="#" class="text-decoration-underline">Terms and Conditions</a>.
            </label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    </form>
</div>
{% endblock %}
