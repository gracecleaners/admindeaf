{% extends 'base.html' %}

{% block title %}Contact Us - RideNow{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg border-0">
        <div class="card-body text-center">
            <h1 class="card-title display-4 mb-4 text-primary">Contact Us</h1>
            <p class="card-text lead mb-5">We’d love to hear from you! Feel free to get in touch with us through any of the following channels:</p>
            
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item">
                            <i class="fas fa-envelope text-secondary"></i> 
                            <strong>Email:</strong> <a href="mailto:support@ridenow.com" class="text-decoration-none text-dark">support@ridenow.com</a>
                        </li>
                        <li class="list-group-item">
                            <i class="fas fa-phone-alt text-secondary"></i> 
                            <strong>Phone:</strong> <a href="tel:+256123456789" class="text-decoration-none text-dark">+256 123 456 789</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
